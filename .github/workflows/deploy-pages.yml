name: Deploy Web App Live to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cancel any stuck Pages deployments
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const deployments = await github.request('GET /repos/{owner}/{repo}/pages/deployments', {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 10
              });
              for (const dep of deployments.data) {
                if (dep.status === 'in_progress' || dep.status === 'queued' || dep.status === 'pending') {
                  console.log(`Cancelling stuck deployment: ${dep.id} (${dep.status})`);
                  await github.request('POST /repos/{owner}/{repo}/pages/deployments/{deployment_id}/cancel', {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    deployment_id: dep.id
                  }).catch(e => console.log(`Cancel error: ${e.message}`));
                }
              }
            } catch(e) {
              console.log(`Could not list deployments: ${e.message}`);
            }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies & Build
        run: |
          npm install
          npm run build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
