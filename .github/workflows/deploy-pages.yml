name: Deploy Web App Live to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Kill stuck github-pages deployments
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Listing all github-pages deployments..."
          DEPLOY_IDS=$(gh api repos/${{ github.repository }}/deployments \
            --jq '.[] | select(.environment=="github-pages") | .id' \
            --paginate 2>/dev/null || echo "")
          for ID in $DEPLOY_IDS; do
            echo "Marking deployment $ID as inactive..."
            gh api repos/${{ github.repository }}/deployments/$ID/statuses \
              -X POST -f state=inactive 2>/dev/null || true
          done
          echo "Done cleaning up."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies & Build
        run: |
          npm install
          npm run build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
