name: Build & Release (EXE + APK + AppImage)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ─── Windows EXE ───────────────────────────────────────────────
  release-windows:
    name: 🪟 Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Generate build icon (PNG only — electron-builder accepts PNG for NSIS)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "build" | Out-Null
          Add-Type -AssemblyName System.Drawing
          $w = 256; $h = 256
          $bmp = New-Object System.Drawing.Bitmap($w, $h, [System.Drawing.Imaging.PixelFormat]::Format32bppArgb)
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          # Background circle
          $brush = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(255, 31, 111, 235))
          $g.FillEllipse($brush, 10, 10, $w - 20, $h - 20)
          # "KV" text
          $font = New-Object System.Drawing.Font("Arial", 80, [System.Drawing.FontStyle]::Bold)
          $textBrush = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::White)
          $sf = New-Object System.Drawing.StringFormat
          $sf.Alignment = [System.Drawing.StringAlignment]::Center
          $sf.LineAlignment = [System.Drawing.StringAlignment]::Center
          $g.DrawString("KV", $font, $textBrush, [System.Drawing.RectangleF]::FromLTRB(0, 0, $w, $h), $sf)
          $g.Dispose()
          $bmp.Save("build\icon.png", [System.Drawing.Imaging.ImageFormat]::Png)
          $bmp.Dispose()
          Write-Host "Icon created at build/icon.png"
          Get-Item "build\icon.png"

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Build Windows EXE
        run: npx electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List output
        run: dir dist_electron /s /b || echo "No dist_electron"
        shell: cmd

      - name: Upload EXE to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist_electron/*.exe
          fail_on_unmatched_files: false
          generate_release_notes: true

  # ─── Linux AppImage + deb ───────────────────────────────────────
  release-linux:
    name: 🐧 Linux AppImage + deb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install system deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y rpm fakeroot dpkg imagemagick

      - name: Generate build icon (Linux)
        run: |
          mkdir -p build
          # Try imagemagick first
          if command -v convert &>/dev/null; then
            convert -size 256x256 xc:"#1f6feb" \
              -font DejaVu-Sans-Bold -pointsize 80 \
              -fill white -gravity center -annotate 0 "KV" \
              build/icon.png
            echo "Icon created via ImageMagick"
          else
            # Python fallback with correct color-type 6 (RGBA)
            python3 - <<'EOF'
          import struct, zlib

          def png_chunk(name, data):
              crc = zlib.crc32(name + data) & 0xffffffff
              return struct.pack('>I', len(data)) + name + data + struct.pack('>I', crc)

          w, h = 256, 256
          raw = b''
          for y in range(h):
              raw += b'\x00'  # filter byte
              for x in range(w):
                  # RGBA blue #1f6feb ff
                  raw += bytes([31, 111, 235, 255])

          compressed = zlib.compress(raw, 9)

          with open('build/icon.png', 'wb') as f:
              f.write(b'\x89PNG\r\n\x1a\n')
              # IHDR: width, height, bit-depth=8, color-type=6 (RGBA), compression=0, filter=0, interlace=0
              f.write(png_chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 6, 0, 0, 0)))
              f.write(png_chunk(b'IDAT', compressed))
              f.write(png_chunk(b'IEND', b''))

          print('PNG created via Python (RGBA, color-type 6)')
          EOF
          fi
          ls -la build/icon.png

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Build Linux AppImage + deb
        run: npx electron-builder --linux AppImage deb --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List output
        run: ls -la dist_electron/ || echo "No dist_electron"

      - name: Upload Linux assets to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist_electron/*.AppImage
            dist_electron/*.deb
          fail_on_unmatched_files: false

  # ─── Android APK ───────────────────────────────────────────────
  release-android:
    name: 🤖 Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Install Android SDK (CRITICAL — ubuntu-latest has no SDK by default)
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies & build web
        run: |
          npm install
          npm run build

      - name: Initialize Capacitor Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Set Gradle permissions
        run: chmod +x android/gradlew

      - name: Build debug APK
        # pipefail ensures Gradle failures propagate correctly
        run: |
          set -o pipefail
          cd android
          ./gradlew assembleDebug --no-daemon --warning-mode=none 2>&1 | tee /tmp/gradle.log
          echo "Gradle exit code: $?"
        continue-on-error: false

      - name: Collect APK
        run: |
          mkdir -p apk-output
          find android -name "*.apk" -exec cp {} apk-output/KnowledgeVault-debug.apk \;
          ls -la apk-output/

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          files: apk-output/*.apk
          fail_on_unmatched_files: false
