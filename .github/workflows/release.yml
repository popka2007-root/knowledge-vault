name: Build & Release (EXE + APK + AppImage)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ─── Windows EXE ───────────────────────────────────────────────
  release-windows:
    name: 🪟 Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Build Windows EXE
        run: npx electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List build output
        run: dir dist_electron /b 2>nul || echo "No dist_electron"
        shell: cmd

      - name: Upload EXE to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist_electron/*.exe
          fail_on_unmatched_files: false
          generate_release_notes: true

  # ─── Linux AppImage + deb ───────────────────────────────────────
  release-linux:
    name: 🐧 Linux AppImage + deb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install system deps for electron-builder
        run: |
          sudo apt-get update -y
          sudo apt-get install -y rpm fakeroot dpkg

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Build Linux AppImage + deb
        run: npx electron-builder --linux AppImage deb --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List build output
        run: ls -la dist_electron/ || echo "No dist_electron"

      - name: Upload Linux assets to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist_electron/*.AppImage
            dist_electron/*.deb
          fail_on_unmatched_files: false

  # ─── Android APK ───────────────────────────────────────────────
  release-android:
    name: 🤖 Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Install dependencies & build web
        run: |
          npm install
          npm run build

      - name: Initialize Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build debug APK
        run: |
          set -eo pipefail
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon --warning-mode=none

      - name: Collect APK
        run: |
          mkdir -p apk-output
          find android -name "*.apk" -exec cp {} apk-output/KnowledgeVault-debug.apk \;
          ls -la apk-output/

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          files: apk-output/*.apk
          fail_on_unmatched_files: false
