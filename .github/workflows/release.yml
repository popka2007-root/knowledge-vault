name: Build & Release (EXE + APK + AppImage)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ─── Windows EXE ───────────────────────────────────────────────
  release-windows:
    name: 🪟 Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install & Build EXE
        run: |
          npm install
          npm run build:exe

      - name: Upload EXE to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist_electron/*.exe
          generate_release_notes: true

  # ─── Linux AppImage + deb ───────────────────────────────────────
  release-linux:
    name: 🐧 Linux AppImage + deb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install system deps for electron-builder
        run: |
          sudo apt-get update -y
          sudo apt-get install -y rpm fakeroot dpkg

      - name: Install & Build Linux
        run: |
          npm install
          npm run build:linux

      - name: Upload Linux assets to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist_electron/*.AppImage
            dist_electron/*.deb

  # ─── Android APK ───────────────────────────────────────────────
  release-android:
    name: 🤖 Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install, build & sync Capacitor
        run: |
          npm install
          npm run build
          npx @capacitor/cli add android 2>/dev/null || true
          npx @capacitor/cli sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/*.apk
